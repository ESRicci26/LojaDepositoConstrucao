spring.application.name=LojaDepositoConstrucao
server.port=8080

# Banco de dados PostgreSQL (ajuste por variaveis de ambiente) Local Windows
spring.datasource.url=${BD_URL:jdbc:postgresql://localhost:5432/lojadepositoconstrucao}
spring.datasource.username=${BD_USUARIO:postgres}
spring.datasource.password=${BD_SENHA:999999}

# =========================================================
# Banco de Dados PostgreSQL - HOSTINGER
# =========================================================
#spring.datasource.url= jdbc:postgresql://77.77.7.777:5432/lojadepositoconstrucao}
#spring.datasource.username=postgres
#spring.datasource.password=999999

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Localização e codificação
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Sessão do administrador (30 minutos)
server.servlet.session.timeout=30m

# Identificador da loja usada no cadastro de produtos
loja.id-padrao=1

# Evita expor detalhes de erro ao usuário final
server.error.include-message=never
server.error.include-stacktrace=never
