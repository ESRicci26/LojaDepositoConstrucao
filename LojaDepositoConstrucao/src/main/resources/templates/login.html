<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho('Login')}"></head>
<body class="pagina-login">

<main class="cartao cartao-login">
    <img th:src="@{/img/icone.png}" alt="Logotipo">
    <h1>Login de Administrador</h1>
    <p class="subtitulo">Por favor, insira suas credenciais abaixo.</p>

    <div class="alerta alerta-sucesso" th:if="${saiu}">Você saiu do sistema.</div>
    <div class="alerta alerta-erro" role="alert" th:if="${erroLogin}" th:text="${erroLogin}"></div>

    <form th:action="@{/login}" th:object="${formulario}" method="post" novalidate>
        <div th:replace="~{fragmentos/base :: erros}"></div>

        <div class="campo">
            <label for="login">Usuário</label>
            <input type="text" id="login" th:field="*{login}" autocomplete="username" autofocus required>
        </div>
        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" th:field="*{senha}" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Confirmar</button>
    </form>
</main>

</body>
</html>
