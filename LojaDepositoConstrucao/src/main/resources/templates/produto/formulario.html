<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecalho(${titulo})}"></head>
<body>
<header th:replace="~{fragmentos/base :: barra('produtos')}"></header>

<main class="container">
    <div class="cabecalho-pagina">
        <h1 th:text="${titulo}">Novo produto</h1>
    </div>

    <section class="cartao">
        <form th:action="@{${acao}}" th:object="${formulario}" method="post" novalidate>
            <div th:replace="~{fragmentos/base :: erros}"></div>

            <div class="grade-formulario">
                <div class="campo coluna-total" th:classappend="${#fields.hasErrors('nome')} ? 'campo-invalido'">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" maxlength="200" required>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('quantidadeEstoque')} ? 'campo-invalido'">
                    <label for="quantidadeEstoque">Quantidade em estoque</label>
                    <input type="number" id="quantidadeEstoque" th:field="*{quantidadeEstoque}" min="0" step="1" required>
                </div>

                <div class="campo" th:classappend="${#fields.hasErrors('valorUnitario')} ? 'campo-invalido'">
                    <label for="valorUnitario">Valor unitário (R$)</label>
                    <input type="number" id="valorUnitario" th:field="*{valorUnitario}" min="0" step="0.01" required>
                </div>
            </div>

            <div class="rodape-formulario">
                <button type="submit" class="btn">Salvar</button>
                <a class="btn btn-secundario" th:href="@{/produtos}">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer th:replace="~{fragmentos/base :: rodape}"></footer>
<script th:replace="~{fragmentos/base :: scripts}"></script>
</body>
</html>
